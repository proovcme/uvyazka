name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[all]' build
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python -m pip install '.[ifc]'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_package.py
      - run: python -m build
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- ../src/uvyazka/viewer
  authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[all,authoring]' pytest
      - run: python -m pytest tests/ifccs -q
      - run: python tools/build_public_demo.py .uvyazka-build/demo-data
  rvt-native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UVYAZKA_HOME: .uvyazka-build/rvt-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/setup_rvt.py --profile dev --with-fixture-generator
      - run: cargo test --locked --manifest-path integrations/rvt-metadata-reader/Cargo.toml --test mep_systems
        env:
          CARGO_TARGET_DIR: .uvyazka-build/rvt-target
      - run: python tools/check_rvt_runtime.py
      - if: runner.os == 'Linux'
        run: python -m pip install 'ifcopenshell>=0.8,<0.9'
      - if: runner.os == 'Linux'
        run: python tools/check_rvt_mep.py --fetch
  rvt-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: .uvyazka-build/rvt-browser-target
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --locked --manifest-path integrations/rvt-browser-bridge/Cargo.toml --target wasm32-unknown-unknown
      - run: cargo test --locked --manifest-path integrations/rvt-browser-bridge/Cargo.toml --lib
  browser-compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install '.[ifc]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: web
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: python tools/build_browser_runtime.py
      - run: python tools/build_demo_site.py
      - run: python tools/fetch_browser_fixtures.py
      - run: python tools/check_browser_runtime.py --serve --channel chromium .uvyazka-build/browser-fixtures/*
