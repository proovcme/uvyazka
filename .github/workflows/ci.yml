name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[all]' build
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python -m pip install '.[ifc]'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_package.py
      - run: python -m build
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- ../src/uvyazka/viewer
