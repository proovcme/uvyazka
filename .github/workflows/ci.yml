name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/check_public_content.py
      - run: |
          mkdir -p .uvyazka-build/privacy-ci
          curl --fail --location --retry 3 --output .uvyazka-build/privacy-ci/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .uvyazka-build/privacy-ci/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .uvyazka-build/privacy-ci/gitleaks.tar.gz -C .uvyazka-build/privacy-ci gitleaks
          .uvyazka-build/privacy-ci/gitleaks git . --log-opts=--all --redact=100 --no-banner
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[all]' build
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python -m pip install '.[ifc]'
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python -m pip install 'lxml>=6,<7'
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python tools/fetch_bcf_schemas.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_package.py
      - run: python -m build
      - run: python tools/check_public_content.py --archive dist/uvyazka-0.4.0a1.tar.gz --archive dist/uvyazka-0.4.0a1-py3-none-any.whl
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- ../src/uvyazka/viewer
  authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[all,authoring]' pytest
      - run: python -m pytest tests/ifccs -q
      - run: python tools/build_public_demo.py .uvyazka-build/demo-data
  rvt-native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UVYAZKA_HOME: .uvyazka-build/rvt-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/setup_rvt.py --profile dev --with-fixture-generator
      - run: cargo test --locked --manifest-path integrations/rvt-metadata-reader/Cargo.toml --test mep_systems
        env:
          CARGO_TARGET_DIR: .uvyazka-build/rvt-target
      - run: python tools/check_rvt_runtime.py
      - if: runner.os == 'Linux'
        run: python -m pip install 'ifcopenshell>=0.8,<0.9'
      - if: runner.os == 'Linux'
        run: python tools/check_rvt_mep.py --fetch
  rvt-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: .uvyazka-build/rvt-browser-target
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --locked --manifest-path integrations/rvt-browser-bridge/Cargo.toml --target wasm32-unknown-unknown
      - run: cargo test --locked --manifest-path integrations/rvt-browser-bridge/Cargo.toml --lib
  browser-compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install '.[ifc]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: web
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: python tools/build_browser_runtime.py
      - run: npm ci
        working-directory: integrations/cad-viewer
      - run: python tools/build_demo_site.py
      - run: python tools/fetch_cad_fixtures.py
      - run: node tools/check_cad_worker.mjs
      - run: python tools/fetch_browser_fixtures.py
      - run: python tools/check_browser_runtime.py --serve --channel chromium .uvyazka-build/browser-fixtures/*.ifc .uvyazka-build/browser-fixtures/*.rvt

  nwd-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked --manifest-path integrations/nwd-browser-bridge/Cargo.toml
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --locked --manifest-path integrations/nwd-browser-bridge/Cargo.toml --target wasm32-unknown-unknown
