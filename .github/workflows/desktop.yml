name: Windows desktop package
on:
  workflow_dispatch:
  push:
    tags: ['v0.4.*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UVYAZKA_HOME: ${{ github.workspace }}/.uvyazka-build/desktop-ci-home
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=C:/uvyazka-source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
            integrations/cad-viewer/package-lock.json
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked --extra all --extra authoring
      - run: uv pip install PyInstaller==6.22.3 pyinstaller-hooks-contrib==2026.9
      - run: rustup toolchain install 1.97.0
      - run: rustup default 1.97.0
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm --prefix web ci
      - run: npm --prefix integrations/cad-viewer ci
      - run: npm --prefix desktop ci
      - run: uv run python tools/setup_rvt.py
      - run: uv run python tools/build_browser_runtime.py
      - run: uv run python tools/build_cad_viewer.py
      - run: npm --prefix web run build
      - run: git diff --exit-code -- src/uvyazka/viewer
      - run: uv run python tools/fetch_desktop_sources.py
      - run: uv run python tools/build_desktop_core.py
      - run: uv run python tools/check_desktop_core.py
      - name: Build signed update package
        run: npm --prefix desktop run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: uvyazka-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            .uvyazka-build/desktop/uvyazka-source.zip
            .uvyazka-build/desktop-sources/*.tar.gz
          if-no-files-found: error
