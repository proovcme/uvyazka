[package]
license = "Apache-2.0"
name = "uvyazka-rvt-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false
description = "Uvyazka browser RVT bridge with saved meshes and explicit conversion diagnostics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rvt = { path = "../rvt-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[profile.release]
lto = false
